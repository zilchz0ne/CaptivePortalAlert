<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Gunmetal / Dark Metallic Outer Border -->
    <linearGradient id="metalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <!-- Golden Amber Wi-Fi Signal Gradient -->
    <linearGradient id="wifiGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Neon Alert Red Gradient -->
    <linearGradient id="alertRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5D5D" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Metallic Highlight Cap for Exclamation Bar -->
    <linearGradient id="alertGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Depth Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Pointy Curved Top Shield Base -->
  <path d="M 64 6 
           C 68 11, 88 18, 114 18 
           C 114 62, 98 104, 64 122 
           C 30 104, 14 62, 14 18 
           C 40 18, 60 11, 64 6 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#metalBorder)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Inner Metallic Bevel Rim -->
  <path d="M 64 11 
           C 68 15, 86 22, 108 22 
           C 108 60, 93 98, 64 114 
           C 35 98, 20 60, 20 22 
           C 42 22, 60 15, 64 11 Z" 
        fill="none" 
        stroke="#71717A" 
        stroke-width="1.2" 
        stroke-opacity="0.3" />

  <!-- Symmetrical Golden Wi-Fi Arcs -->
  <g fill="none" stroke="url(#wifiGold)" stroke-linecap="round" filter="url(#softShadow)">
    <!-- Outer Arc -->
    <path d="M 36 50 A 34 34 0 0 1 92 50" stroke-width="7.5" />
    <!-- Middle Arc -->
    <path d="M 46 60 A 22 22 0 0 1 82 60" stroke-width="7" />
    <!-- Inner Arc -->
    <path d="M 56 70 A 10 10 0 0 1 72 70" stroke-width="6.5" />
  </g>

  <!-- Perfectly Centered Base Dot (Golden Wi-Fi Origin) -->
  <circle cx="64" cy="82" r="4.5" fill="url(#wifiGold)" filter="url(#softShadow)" />

  <!-- Polished Forward-Slanted Exclamation Mark Layer (+12 Degree Rotation) -->
  <g transform="rotate(21, 64, 58)" filter="url(#softShadow)">
    <!-- 1. Dark Cutout Halo: Even separation around forward-slanted mark -->
    <path d="M 64 30 
             C 68.5 30, 71 32.5, 69.5 41 
             L 67.5 69 
             C 67 72, 61 72, 60.5 69 
             L 58.5 41 
             C 57 32.5, 59.5 30, 64 30 Z" 
          fill="#0F0F12" />
    <circle cx="64" cy="82" r="8" fill="#0F0F12" />

    <!-- 2. Refined Tapered Exclamation Bar with Rounded Ends -->
    <path d="M 64 33 
             C 66.8 33, 68 35, 67 42 
             L 65.2 67.5 
             C 64.9 69.5, 63.1 69.5, 62.8 67.5 
             L 61 42 
             C 60 35, 61.2 33, 64 33 Z" 
          fill="url(#alertRed)" />

    <!-- 3. Top Specular Glint for Extra Polish -->
    <path d="M 64 33 
             C 66.8 33, 68 35, 67 42 
             L 65.5 54 
             L 62.5 54 
             L 61 42 
             C 60 35, 61.2 33, 64 33 Z" 
          fill="url(#alertGlint)" opacity="0.6" />

    <!-- 4. Matching Red Exclamation Dot -->
    <circle cx="64" cy="82" r="5" fill="url(#alertRed)" />
  </g>
</svg>

