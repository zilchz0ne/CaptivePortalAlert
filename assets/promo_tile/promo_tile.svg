<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <!-- Background Gradient Matching Shield Theme -->
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Shield Obsidian Background -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Gunmetal Border Gradient -->
    <linearGradient id="metalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <!-- Golden Amber Wi-Fi Signal Gradient -->
    <linearGradient id="wifiGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Neon Alert Red Gradient -->
    <linearGradient id="alertRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5D5D" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Metallic Highlight Cap for Exclamation Bar -->
    <linearGradient id="alertGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Soft Glow Behind Shield -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="440" height="280" fill="url(#promoBg)" />

  <!-- Subtle Radial Glow Behind Icon -->
  <circle cx="220" cy="95" r="110" fill="url(#amberGlow)" />

  <!-- ================= SHIELD ICON (Centered & Scaled) ================= -->
  <g transform="translate(156, 15)">
    <!-- Pointy Curved Top Shield Base -->
    <path d="M 64 6 
             C 68 11, 88 18, 114 18 
             C 114 62, 98 104, 64 122 
             C 30 104, 14 62, 14 18 
             C 40 18, 60 11, 64 6 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#metalBorder)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Inner Metallic Bevel Rim -->
    <path d="M 64 11 
             C 68 15, 86 22, 108 22 
             C 108 60, 93 98, 64 114 
             C 35 98, 20 60, 20 22 
             C 42 22, 60 15, 64 11 Z" 
          fill="none" 
          stroke="#71717A" 
          stroke-width="1.2" 
          stroke-opacity="0.3" />

    <!-- Golden Wi-Fi Arcs -->
    <g fill="none" stroke="url(#wifiGold)" stroke-linecap="round" filter="url(#softShadow)">
      <path d="M 36 50 A 34 34 0 0 1 92 50" stroke-width="7.5" />
      <path d="M 46 60 A 22 22 0 0 1 82 60" stroke-width="7" />
      <path d="M 56 70 A 10 10 0 0 1 72 70" stroke-width="6.5" />
    </g>

    <!-- Base Dot -->
    <circle cx="64" cy="82" r="4.5" fill="url(#wifiGold)" filter="url(#softShadow)" />

    <!-- Forward-Slanted Exclamation Mark (+12°) -->
    <g transform="rotate(21, 64, 58)" filter="url(#softShadow)">
      <path d="M 64 30 C 68.5 30, 71 32.5, 69.5 41 L 67.5 69 C 67 72, 61 72, 60.5 69 L 58.5 41 C 57 32.5, 59.5 30, 64 30 Z" fill="#0F0F12" />
      <circle cx="64" cy="82" r="8" fill="#0F0F12" />
      <path d="M 64 33 C 66.8 33, 68 35, 67 42 L 65.2 67.5 C 64.9 69.5, 63.1 69.5, 62.8 67.5 L 61 42 C 60 35, 61.2 33, 64 33 Z" fill="url(#alertRed)" />
      <path d="M 64 33 C 66.8 33, 68 35, 67 42 L 65.5 54 L 62.5 54 L 61 42 C 60 35, 61.2 33, 64 33 Z" fill="url(#alertGlint)" opacity="0.6" />
      <circle cx="64" cy="82" r="5" fill="url(#alertRed)" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING ================= -->
  <!-- Extension Name -->
  <text x="220" y="185" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="22" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="#F4F4F5" 
        text-anchor="middle">
    Public Wi-Fi Phishing Alert
  </text>

  <!-- Tagline -->
  <text x="220" y="215" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="13" 
        font-weight="500" 
        fill="#A1A1AA" 
        text-anchor="middle">
    Stay Safer on Public Wi-Fi
  </text>

  <!-- Decorative Accent Pill Badge -->
  <g transform="translate(160, 235)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1" />
    <text x="60" y="13.5" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="1" 
          fill="#FBBF24" 
          text-anchor="middle">
      PROTECTED
    </text>
  </g>
</svg>

